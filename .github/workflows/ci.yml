name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported line (engines: >=22.20.0) and the current LTS.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run check
      - name: Validate with the Agent Skills reference validator
        if: matrix.node-version == 24
        env:
          SKILLS_REF: git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref
        run: |
          for skill in skills/*/; do
            pipx run --spec "$SKILLS_REF" skills-ref validate "$skill"
          done
